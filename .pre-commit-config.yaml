# =============================================================================
# .pre-commit-config.yaml — apenas verificações RÁPIDAS (segundos, sobre os arquivos
# em staging). Checagens pesadas (basedpyright, bandit, vulture, refurb, xenon,
# interrogate, pip-audit e a suíte completa com cobertura) rodam no CI e em
# `make check`: commits são locais e baratos de corrigir; o merge é o portão.
#
# Setup:
#   make install      # uv sync + pre-commit install (pre-commit e commit-msg)
#   uv run detect-secrets scan > .secrets.baseline   # gera o baseline
#   uv run pre-commit autoupdate                      # reveja os `rev` periodicamente
# =============================================================================

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # --- Higiene básica de arquivos -----------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]   # bloqueia commit de dados/modelos grandes
      - id: detect-private-key

  # --- Ruff: lint + format -------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # --- detect-secrets: impede vazamento de credenciais ---------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # --- nbstripout: remove outputs de notebooks antes do commit -------------
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # --- commitizen: valida Conventional Commits (stage commit-msg) ----------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.5
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # --- Smoke tests rápidos (local) -----------------------------------------
  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest (smoke)
        entry: uv run pytest -m smoke -q --no-cov
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
