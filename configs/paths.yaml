# =============================================================================
# paths.yaml — Caminhos de dados, modelos e saídas (relativos à raiz do projeto).
# Nunca use caminhos hardcoded no código; centralize aqui e em src/config/paths.py.
# Dados em arquitetura medalhão: bronze (como recebido) -> silver (limpo) -> gold (modelagem).
# =============================================================================
data:
  bronze: "data/bronze/creditcard.csv"      # imutável; manifest.json ao lado guarda o SHA-256
  silver: "data/silver/transactions.parquet" # validado (pandera) e deduplicado
  gold: "data/gold"
  train: "data/gold/train.parquet"
  val: "data/gold/val.parquet"
  test: "data/gold/test.parquet"

models:
  dir: "models"
  model: "models/fraud_model.joblib"
  metadata: "models/fraud_model.json"

reports:
  figures: "reports/figures"
  metrics: "reports/metrics"
  model_cards: "reports/model_cards"
  datasheets: "reports/datasheets"

logs: "logs"
