# =============================================================================
# pyproject.toml — fonte única de verdade para dependências e configuração de
# ferramentas. Gerenciador: uv. O uv.lock DEVE ser commitado.
# =============================================================================

[project]
name = "mlops-deteccao-fraude"
version = "0.3.0"
description = "Pipeline MLOps de detecção de fraude em cartão de crédito: dados medalhão, XGBoost com IC 95%, API FastAPI, MLflow e CI/CD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luan Freitas", email = "luan.freitas@gmail.com" }]
keywords = [
    "mlops",
    "fraude",
    "detecção de fraude",
    "machine learning",
    "data science",
    "pipeline de machine learning",
    "explicabilidade",
]
classifiers = [ # https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Portuguese (Brazilian)",
]

# --- Dependências de runtime (apenas o que o projeto usa) --------------------
dependencies = [
    # Dados: polars (preferência) + pandas (interface do scikit-learn) + storage colunar
    "polars>=1.43.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "pandas>=2.2",
    # Contratos de dados (bronze -> silver -> gold e entrada da API)
    "pandera[polars]>=0.32.1",
    # Configuração e validação em runtime
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Progresso e logging
    "rich>=13.7",
    # Visualização
    "seaborn>=0.13",
    "matplotlib>=3.9",
    # Modelagem e desbalanceamento
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "imbalanced-learn>=0.12",
    "joblib>=1.4",
    # Rastreamento de experimentos (log_model(name=...) exige MLflow >= 3)
    "mlflow>=3.0",
]

[project.urls]
Homepage = "https://github.com/luanfreitas5/mlops-deteccao-fraude"

# --- Extras opcionais (uv sync --extra app) ----------------------------------
[project.optional-dependencies]
# Dashboard interativo de explicabilidade (Streamlit + Plotly)
app = [
    "streamlit>=1.60.0",
    "plotly>=6.9.0",
]

# --- Grupos de dependências (PEP 735): separam runtime de ferramentas ---------
[dependency-groups]
dev = [
    "ruff>=0.15.22",          # lint + format (substitui flake8/isort/black)
    "basedpyright>=1.13",     # type checking estático (CI)
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.158.1",    # testes property-based
    "httpx>=0.27",            # cliente HTTP exigido pelo TestClient do FastAPI
    "pre-commit>=4.6.1",
    "commitizen>=4.16.5",     # Conventional Commits + SemVer + CHANGELOG
    "detect-secrets>=1.5",
    "nbstripout>=0.7",
]
quality = [                   # checagens pesadas: rodam no CI e em `make check`
    "bandit[toml]>=1.7",
    "vulture>=2.11",
    "refurb>=2.0",
    "xenon>=0.9",
    "radon>=6.0",
    "interrogate>=1.7",
    "pip-audit>=2.7",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
notebooks = [
    "nbqa>=1.8",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "pip>=26.1.2",            # exigido pelo Data Wrangler no VS Code
]
profiling = [
    "scalene>=1.5",           # sob demanda: meça antes de otimizar
]

[tool.uv]
package = false               # aplicação, não biblioteca; o código em src/ é importado como `src.*`
default-groups = ["dev"]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Restrições em dependências transitivas por segurança (pip-audit).
# gitpython < 3.1.51 (puxado pelo mlflow) tem 2 CVEs corrigidos na 3.1.51:
# GHSA-2f96-g7mh-g2hx e GHSA-v396-v7q4-x2qj.
# pyasn1 < 0.6.4 tem 2 CVEs corrigidos na 0.6.4: CVE-2026-59885 e CVE-2026-59886.
constraint-dependencies = ["gitpython>=3.1.51", "pyasn1>=0.6.4"]

# ---------------- ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (organização de imports)
    "N",      # pep8-naming
    "UP",     # pyupgrade (sintaxe moderna)
    "B",      # flake8-bugbear (bugs comuns e más práticas)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (usar Path em vez de os.path)
    "PD",     # pandas-vet — antipadrões específicos de pandas
    "NPY",    # NumPy-specific rules
    "PERF",   # perflint — antipadrões de performance
    "RUF",    # regras específicas do próprio Ruff
    "PL",     # pylint (subconjunto)
    "TRY",    # tryceratops — boas práticas de exception handling
]
ignore = [
    "PLR0913", # muitos argumentos em função — comum em pipelines de ML
    "PLR2004", # "magic value" em comparação — comum em thresholds de modelo
    "TRY003",  # mensagem longa em exceção customizada
    "PLC0415", # import fora do topo — usado em testes para isolar imports
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # docstrings no formato NumPy

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]        # fixtures e valores fixos em testes
"notebooks/*" = ["E402", "F401"]      # imports fora de ordem/não usados em notebooks

[tool.ruff.format]
docstring-code-format = true

# ------------- basedpyright -------------
[tool.basedpyright]
include = ["src"]
exclude = ["**/__pycache__", "notebooks", "data", "models"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# ---------------- pytest ----------------
# A cobertura NÃO fica em addopts: o hook de smoke do pre-commit precisa ser rápido.
# Use `make test` (ou `pytest --cov`) para medir a cobertura.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]            # imports absolutos a partir da raiz: `from src...`, `from app...`
addopts = "-ra --strict-markers"
markers = [
    "smoke: testes rápidos (< 10 s) usados no pre-commit",
    "integration: testes de pipeline ponta a ponta",
    "ml: testes comportamentais / de regressão de métrica",
    "slow: testes lentos (treino, integração)",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/main.py", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ------------- qualidade (CI) -------------
[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]

[tool.vulture]
paths = ["src"]
min_confidence = 80
exclude = ["notebooks/"]

[tool.refurb]
ignore = [
    "FURB105",  # print() sem parênteses vazios — inofensivo
    "FURB126",  # return implícito — às vezes reduz clareza em funções longas
]

[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
exclude = ["tests", "notebooks", "docs"]

# ---------------- commitizen ----------------
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"   # lê [project].version
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
